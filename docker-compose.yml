# Shop compose file — created 2026-09-22 to make this service reproducible.
#
# The running container was previously started with a bare `docker run`, so its
# configuration lived only inside the live container (same trap as watchtower — a
# `docker rm` would have lost it). This file matches that exact config:
# build from this directory, port 8100 -> 80, and host.docker.internal so the
# nginx config can proxy /api and /data to the POS on :5000.
#
# Public access: the Cloudflare tunnel `ngrsine-pi` maps ngrsine.com and
# www.ngrsine.com to http://localhost:8100 (public hostnames added in the
# Zero Trust dashboard — token-managed tunnel, so there is no local ingress file).
#
# Rebuild + redeploy:
#   cd /home/pi/ngrsine-shop && npm run build
#   sudo docker compose build && sudo docker compose up -d
services:
  shop:
    build: .
    container_name: ngrsine-shop
    ports:
      - "8100:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
