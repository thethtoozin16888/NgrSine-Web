# NgrSine shop (ngrsine.com) — nginx config
# Security hardening & performance optimization (Audited 2026-10-25)

# ── Cloudflare Tunnel Real IP Resolution ──
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

# Rate-limit zone: 30 requests/min per real client IP, with burst buffer.
limit_req_zone $binary_remote_addr zone=shopapi:10m rate=30r/m;

# ── Analytics Log Format with Cloudflare Real IP & Country ──
log_format analytics '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_cf_connecting_ip" "$http_cf_ipcountry"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log analytics;

    # ── Security Hardening: Hide Server Version ──
    server_tokens off;

    # ── Client Request Limits ──
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # ── Security Headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Cloudflare terminates TLS; enforce HTTPS for all subdomains
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    # Content Security Policy (strict self + google fonts + media assets)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'self';" always;

    # ── Performance: Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Block Sensitive Files & Dotfiles ──
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~* \.(bak|sql|db|env|log|old|swp|yml|yaml|ini|conf)$ { deny all; access_log off; log_not_found off; }

    # ── Proxy API calls to the POS backend ──
    location ^~ /api/ {
        limit_req zone=shopapi burst=20 nodelay;
        proxy_pass http://host.docker.internal:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Real visitor IP passed through Cloudflare tunnel to backend
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # ── Proxy product photos & videos to backend with Caching ──
    location ^~ /data/ {
        proxy_pass http://host.docker.internal:5000/data/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ── Cache static assets from Vite dist ──
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ── Single Page Application Fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
